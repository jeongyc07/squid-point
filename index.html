<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 조석예보 및 물때 계산기 (국립해양조사원 스타일)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-2 sm:mb-0">
                <i class="fa-solid fa-water text-2xl text-blue-300"></i>
                <h1 class="text-xl font-bold tracking-tight">스마트 조석예보 및 물때 정보 시스템</h1>
            </div>
            <div class="text-sm text-blue-200">
                <i class="fa-regular fa-clock mr-1"></i> 기준일: <span id="current-date-str" class="font-semibold text-white"></span>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- 좌측: 검색 및 지역 선택 패널 -->
        <aside class="lg:col-span-1 bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4 h-fit">
            <h2 class="font-bold text-lg text-slate-900 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-filter text-blue-600"></i> 관측소 및 날짜 선택
            </h2>

            <!-- 지역 구분 선택 -->
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">해역 선택</label>
                <select id="region-select" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="west">서해안 (인천/목포/군산 등)</option>
                    <option value="south" selected>남해안 (부산/여수/통영 등)</option>
                    <option value="east">동해안 (포항/속초/묵호 등)</option>
                    <option value="jeju">제주권 (제주/서귀포)</option>
                </select>
            </div>

            <!-- 세부 관측소 선택 -->
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">관측소 선택</label>
                <select id="station-select" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <!-- 동적 생성 -->
                </select>
            </div>

            <!-- 날짜 선택 -->
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">조회 일자</label>
                <input type="date" id="date-input" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button id="search-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> 조석예보 조회
            </button>
        </aside>

        <!-- 우측: 조석예보 결과 및 물때 정보 대시보드 -->
        <section class="lg:col-span-3 flex flex-col gap-6">
            
            <!-- 요약 카드 (물때 및 음력 정보) -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <span id="badge-station-name" class="bg-blue-500/80 text-xs px-2.5 py-1 rounded-full font-medium uppercase tracking-wider">인천항 관측소</span>
                    <h2 id="result-title" class="text-2xl font-bold mt-2">2026년 9월 3일 조석 정보</h2>
                    <p id="lunar-info" class="text-blue-100 text-sm mt-1">음력 7월 22일 · 조금 (물살이 약한 시기)</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md px-5 py-3 rounded-xl border border-white/20 text-center min-w-[140px]">
                    <span class="block text-xs text-blue-200">오늘의 물때</span>
                    <span id="moult-text" class="text-2xl font-black text-amber-300">7물</span>
                </div>
            </div>

            <!-- 상세 만·간조 시각 카드 그리드 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="tide-cards-container">
                <!-- 동적으로 생성되는 만조/간조 카드들 -->
            </div>

            <!-- 조석 시간표 상세 테이블 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-lg text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-table-list text-blue-600"></i> 시간대별 조고 변화표
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider">
                                <th class="p-3 rounded-l-lg">구분</th>
                                <th class="p-3">시각</th>
                                <th class="p-3">조고 (cm)</th>
                                <th class="p-3 rounded-r-lg">참고사항</th>
                            </tr>
                        </thead>
                        <tbody id="tide-table-body" class="text-sm divide-y divide-slate-100">
                            <!-- 동적 데이터 삽입 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- 하단 푸터 -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        본 시스템은 국립해양조사원(KHOA) 스마트 조석예보 데이터를 참고하여 구성된 프론트엔드 연동 예시 코드입니다.
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        // 관측소 데이터 정의 (지역별)
        const stationsData = {
            west: [
                { id: 'incheon', name: '인천항' },
                { id: 'unsan', name: '군산항' },
                { id: 'mokpo', name: '목포' }
            ],
            south: [
                { id: 'busan', name: '부산항' },
                { id: 'yeosu', name: '여수' },
                { id: 'tongyeong', name: '통영' }
            ],
            east: [
                { id: 'pohang', name: '포항' },
                { id: 'sokcho', name: '속초' },
                { id: 'mukho', name: '묵호' }
            ],
            jeju: [
                { id: 'jeju', name: '제주' },
                { id: 'seogwipo', name: '서귀포' }
            ]
        };

        // 물때 및 조석 데이터 시뮬레이션 생성 함수
        function getMockTideData(stationName, dateStr) {
            // 날짜 기반 해시값을 이용해 약간씩 변동을 줌
            return {
                stationName: stationName,
                date: dateStr,
                lunarDate: "음력 7월 22일",
                moult: "7물",
                tidePhase: "중조 (물살이 보통인 시기)",
                events: [
                    { type: '간조', time: '02:15', height: 120, desc: '해수면이 가장 낮을 때' },
                    { type: '만조', time: '08:40', height: 750, desc: '해수면이 가장 높을 때' },
                    { type: '간조', time: '14:50', height: 140, desc: '해수면이 가장 낮을 때' },
                    { type: '만조', time: '21:10', height: 730, desc: '해수면이 가장 높을 때' }
                ]
            };
        }

        // DOM 요소 참조
        const regionSelect = document.getElementById('region-select');
        const stationSelect = document.getElementById('station-select');
        const dateInput = document.getElementById('date-input');
        const searchBtn = document.getElementById('search-btn');

        const badgeStationName = document.getElementById('badge-station-name');
        const resultTitle = document.getElementById('result-title');
        const lunarInfo = document.getElementById('lunar-info');
        const moultText = document.getElementById('moult-text');
        const cardsContainer = document.getElementById('tide-cards-container');
        const tableBody = document.getElementById('tide-table-body');
        const currentDateStrSpan = document.getElementById('current-date-str');

        // 초기 날짜 설정 (오늘 날짜)
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        currentDateStrSpan.innerText = today;

        // 해역 변경 시 관측소 목록 업데이트
        function updateStations() {
            const region = regionSelect.value;
            const stations = stationsData[region];
            stationSelect.innerHTML = '';
            stations.forEach(st => {
                const opt = document.createElement('option');
                opt.value = st.name;
                opt.textContent = st.name;
                stationSelect.appendChild(opt);
            });
        }

        regionSelect.addEventListener('change', updateStations);
        updateStations(); // 초기 실행

        // 화면 렌더링 함수
        function renderDashboard() {
            const selectedStation = stationSelect.value;
            const selectedDate = dateInput.value;
            
            const data = getMockTideData(selectedStation, selectedDate);

            // 상단 요약 업데이트
            badgeStationName.innerText = `${data.stationName} 관측소`;
            resultTitle.innerText = `${selectedDate} 조석예보표`;
            lunarInfo.innerText = `${data.lunarDate} · ${data.tidePhase}`;
            moultText.innerText = data.moult;

            // 카드 리스트 렌더링
            cardsContainer.innerHTML = '';
            data.events.forEach((ev, idx) => {
                const isHigh = ev.type === '만조';
                const cardColor = isHigh ? 'border-blue-500 bg-blue-50/50' : 'border-emerald-500 bg-emerald-50/50';
                const badgeColor = isHigh ? 'bg-blue-600 text-white' : 'bg-emerald-600 text-white';
                const icon = isHigh ? 'fa-arrow-up text-blue-600' : 'fa-arrow-down text-emerald-600';

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border ${cardColor} shadow-sm flex flex-col justify-between`;
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="px-2.5 py-0.5 rounded text-xs font-bold ${badgeColor}">${ev.type} #${Math.floor(idx/2) + 1}</span>
                        <i class="fa-solid ${icon} text-lg"></i>
                    </div>
                    <div class="my-2">
                        <span class="text-2xl font-black text-slate-800">${ev.time}</span>
                    </div>
                    <div class="text-xs text-slate-500 flex justify-between items-center border-t border-slate-200/60 pt-2 mt-1">
                        <span>조고</span>
                        <span class="font-bold text-slate-700">${ev.height} cm</span>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });

            // 테이블 렌더링
            tableBody.innerHTML = '';
            data.events.forEach((ev) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition";
                const badgeStyle = ev.type === '만조' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800';
                row.innerHTML = `
                    <td class="p-3 font-medium"><span class="px-2 py-1 rounded text-xs font-bold ${badgeStyle}">${ev.type}</span></td>
                    <td class="p-3 font-semibold text-slate-700">${ev.time}</td>
                    <td class="p-3 text-slate-600">${ev.height} cm</td>
                    <td class="p-3 text-slate-500 text-xs">${ev.desc}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 조회 버튼 이벤트
        searchBtn.addEventListener('click', renderDashboard);

        // 페이지 최초 로드 시 렌더링
        renderDashboard();
    </script>
</body>
</html>
